name: Publish memory-router to npm

# Triggered by pushing a tag matching `memory-router-v*`. The tag's
# version segment must match `packages/memory-router/package.json` or
# the workflow fails before publishing.
#
# This repo is not an npm workspace (see ci.yml) so the workflow runs
# every step from inside `packages/memory-router` instead of using
# `--workspace` flags. agent-grounding's publish-libs.yml is the
# reference but it relies on workspaces; the shape here is adapted.
#
# Push tags ONE AT A TIME. GitHub coalesces a multi-tag push into a
# single push event, which fires the workflow only once with one
# arbitrary tag - the others ship without provenance or version checks.

on:
  push:
    tags:
      - "memory-router-v*"

permissions:
  contents: read
  # id-token is required for `npm publish --provenance` to mint
  # signed attestations, and is also what npm Trusted Publishing (OIDC)
  # matches against the package's Trusted Publisher entry on npmjs.com
  # (repo LanNguyenSi/agent-memory, workflow publish-memory-router.yml)
  # instead of an NPM_TOKEN secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/memory-router
    steps:
      - uses: actions/checkout@v5

      - name: Parse tag
        id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#memory-router-v}"
          if [ "$version" = "$tag" ]; then
            echo "::error::Tag $tag does not match expected pattern memory-router-v<semver>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing @lannguyensi/memory-router@${version}"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/memory-router/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Native-dep smoke
        # better-sqlite3 + sqlite-vec ship prebuilt binaries that can
        # silently fall back to source compile on ABI mismatch. Run a
        # tiny require + call before tests so a broken postinstall
        # fails loudly at the install boundary, not deep in tests.
        run: |
          node -e "const D=require('better-sqlite3');const v=require('sqlite-vec');const db=new D(':memory:');v.load(db);console.log('native deps OK:', db.prepare('SELECT vec_version() AS r').get());db.close();"

      - name: Verify package version matches tag
        env:
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match packages/memory-router/package.json ($pkg_version). Update package.json before tagging." >&2
            exit 1
          fi

      - name: Verify package name is scoped
        # Cheap regression-pin: if someone unscopes the package by
        # accident we want to fail before publishing instead of
        # quietly creating a different package on npm.
        run: |
          pkg_name=$(node -p "require('./package.json').name")
          if [ "$pkg_name" != "@lannguyensi/memory-router" ]; then
            echo "::error::package.json name is '$pkg_name', expected '@lannguyensi/memory-router'." >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        # Re-run the full suite as a release-gate, separately from CI.
        # ci.yml runs on every push to master; this one runs on the
        # exact commit being published.
        run: npm test

      - name: Upgrade npm for trusted publishing
        # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; node 22 bundles
        # npm 10, so upgrade first. Auth comes from the GitHub OIDC token
        # (permissions.id-token: write above) matched against the package's
        # Trusted Publisher entry on npmjs.com (repo LanNguyenSi/agent-memory,
        # workflow publish-memory-router.yml), not an NPM_TOKEN secret.
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Publish
        env:
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          version="${TAG_VERSION}"
          pkg=$(node -p "require('./package.json').name")

          # Idempotency: re-running the failed job (Actions -> the failed run ->
          # Re-run failed jobs) can land on a version a prior attempt already
          # published.
          if npm view "${pkg}@${version}" version > /dev/null 2>&1; then
            echo "::notice::${pkg}@${version} is already on the registry; nothing to publish."
            exit 0
          fi

          # Sigstore Rekor occasionally returns a transient TLOG_CREATE_ENTRY
          # 409 (npm/cli#6892) that fails --provenance even though the tarball
          # is fine. Retry up to 3 times with exponential backoff, and treat
          # "already published" as success in case a failed attempt actually
          # reached the registry.
          max=3
          attempt=1
          while true; do
            echo "npm publish attempt ${attempt}/${max}"
            if npm publish --access public --provenance; then
              echo "::notice::Published ${pkg}@${version} on attempt ${attempt}."
              exit 0
            fi
            # A failed --provenance publish can still have landed the tarball;
            # give the registry a moment to settle before checking.
            sleep 5
            if npm view "${pkg}@${version}" version > /dev/null 2>&1; then
              echo "::notice::${pkg}@${version} reached the registry despite a non-zero publish exit; treating as success."
              exit 0
            fi
            if [ "${attempt}" -ge "${max}" ]; then
              echo "::error::npm publish failed after ${max} attempts. If the failure is a Sigstore TLog 409, re-run the failed job on this run (Actions -> the failed run -> Re-run failed jobs) once the Rekor service recovers. A persistent 403/404 instead likely means the npmjs.com Trusted Publisher entry for this repo/workflow is missing or misconfigured; retrying will not fix that." >&2
              exit 1
            fi
            backoff=$((2 ** attempt * 5))
            echo "publish failed; retrying in ${backoff}s"
            sleep "${backoff}"
            attempt=$((attempt + 1))
          done
